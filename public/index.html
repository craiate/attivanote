<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>AttivaNote - L'Enciclopedia Universale</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=4">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
</head>
<body class="bg-slate-900 text-slate-200 antialiased overflow-x-hidden">

    <button id="mobile-menu-btn" class="fixed top-4 right-4 z-50 p-3 bg-blue-600 text-white rounded-lg shadow-xl md:hidden hover:bg-blue-700 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
        </svg>
    </button>

    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-72 bg-slate-800 border-r border-slate-700 flex flex-col p-8 transition-transform duration-300 transform -translate-x-full md:translate-x-0 shadow-2xl md:shadow-none">
        <div class="mb-8">
             <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
                <span class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-sm">AN</span>
                AttivaNote
             </h1>
             <p class="text-xs italic text-slate-400 mt-2 font-serif">"Ciò che sai, divieni"</p>
        </div>

        <nav class="flex-1 overflow-y-auto" id="category-nav">
            <ul class="space-y-2" id="category-list">
                </ul>
        </nav>

        <button id="btn-new-search" class="mt-8 w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 group">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 group-hover:rotate-90 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" /></svg>
            Nuova Ricerca
        </button>
    </aside>

    <div class="transition-all duration-300 p-6 ml-0 md:ml-72 min-h-screen">
        
        <div id="modal-search" class="hidden fixed inset-0 z-50 flex items-center justify-center px-4">
            <div class="absolute inset-0 bg-slate-900/90 backdrop-blur-sm transition-opacity" id="btn-close-modal"></div>
            <div class="relative w-full max-w-xl bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl p-8 overflow-hidden">
                
                <div id="search-form-container">
                    <h2 class="text-3xl font-bold text-white mb-6 text-center font-serif">Nuova Indagine</h2>
                    <form id="search-form" class="space-y-4">
                        <input type="text" id="search-input" class="w-full bg-slate-800 text-white px-6 py-4 rounded-xl border border-slate-700 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/50 outline-none text-lg placeholder-slate-500 transition-all" placeholder="Cosa vuoi scoprire oggi?" required autocomplete="off">
                        <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-4 rounded-xl shadow-lg transform active:scale-[0.98] transition-all">
                            Avvia Ricerca AI
                        </button>
                    </form>
                </div>

                <div id="loader-container" class="hidden py-12 flex flex-col items-center justify-center space-y-6">
                    <div class="w-16 h-16 border-4 border-slate-800 border-t-blue-600 rounded-full animate-spin"></div>
                    <p id="loader-status" class="text-blue-400 font-serif italic text-lg animate-pulse">Sintetizzando la conoscenza...</p>
                </div>
            </div>
        </div>

        <div id="view-archive" class="animate-fade-in max-w-7xl mx-auto pt-14 md:pt-10">
            <div class="mb-12">
                <h2 class="text-4xl md:text-5xl font-bold text-white font-serif mb-4">Archivio Universale</h2>
                <p class="text-slate-400 text-lg max-w-2xl">Esplora la collezione completa delle conoscenze acquisite.</p>
            </div>
            <div id="monograph-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                </div>
        </div>

        <div id="view-detail" class="hidden animate-fade-in pt-14 md:pt-0">
            </div>

    </div>

    <script>
        const btn = document.getElementById('mobile-menu-btn');
        const sidebar = document.getElementById('sidebar');
        
        // Apre/Chiude il menu al click del pulsante
        if(btn) {
            btn.addEventListener('click', () => {
                sidebar.classList.toggle('-translate-x-full');
            });
        }

        // Chiude il menu automaticamente quando clicchi su una categoria (solo su mobile)
        if(sidebar) {
            sidebar.addEventListener('click', (e) => {
                // Se lo schermo è piccolo (mobile/tablet)
                if(window.innerWidth < 768) {
                    // Evitiamo che si chiuda se clicchi nella casella di ricerca
                    if(e.target.tagName !== 'INPUT') {
                        sidebar.classList.add('-translate-x-full');
                    }
                }
            });
        }
    </script>

    <script type="module" src="app.js?v=4"></script>
</body>
</html>
